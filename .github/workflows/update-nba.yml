name: Update NBA data and picks

on:
  workflow_dispatch:

  push:
    paths:
      - "data/picks.json"

  schedule:
    # Новосибирское время:
    # 08:20, 12:20, 16:20 и 20:20
    - cron: "20 1,5,9,13 * * *"

permissions:
  contents: write

concurrency:
  group: nba-data-and-picks-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate current picks
        run: |
          node -e "
            const fs = require('fs');

            const data = JSON.parse(
              fs.readFileSync(
                'data/picks.json',
                'utf8'
              )
            );

            if (!data.games || !data.picks) {
              throw new Error(
                'Invalid data/picks.json'
              );
            }

            console.log(
              'Current games:',
              Object.keys(data.games).length
            );

            const count = Object.values(
              data.picks
            ).reduce(
              (sum, item) =>
                sum +
                Object.keys(item || {}).length,
              0
            );

            console.log(
              'Current picks:',
              count
            );
          "

      - name: Update NBA data
        run: node scripts/update-nba-data.js

      - name: Archive current picks
        run: node scripts/archive-picks.js

      - name: Calculate picks results
        run: node scripts/calculate-picks.js

      - name: Validate generated results
        run: |
          node -e "
            const fs = require('fs');

            const archive = JSON.parse(
              fs.readFileSync(
                'data/picks-archive.json',
                'utf8'
              )
            );

            const results = JSON.parse(
              fs.readFileSync(
                'data/picks-results.json',
                'utf8'
              )
            );

            const archivedPicks =
              Object.values(
                archive.picks || {}
              ).reduce(
                (sum, item) =>
                  sum +
                  Object.keys(
                    item || {}
                  ).length,
                0
              );

            console.log(
              'Archived games:',
              Object.keys(
                archive.games || {}
              ).length
            );

            console.log(
              'Archived picks:',
              archivedPicks
            );

            console.log(
              'Calculated results:',
              results.results?.length || 0
            );

            if (!results.updatedAt) {
              throw new Error(
                'Results were not updated'
              );
            }
          "

      - name: Show changed files
        run: git status --short

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update NBA data, picks archive and results"
          file_pattern: "data/nba-2026-2027.json data/nba-2026.json data/picks-archive.json data/picks-results.json"
