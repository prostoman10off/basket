name: Update NBA data

on:
  workflow_dispatch:

  schedule:
    # Каждый день в 09:20 UTC.
    # Примерно 12:20 по Москве.
    - cron: "20 9 * * *"

permissions:
  contents: write

jobs:
  update-nba-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update NBA JSON
        run: node scripts/update-nba-data.js

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update NBA season data"
          file_pattern: data/nba-2026-2027.json
